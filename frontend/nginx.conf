server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  # 同步连接器、批量入库、文档导入都是分钟级任务；nginx 默认 60s 读超时会在任务还没跑完时
  # 先给浏览器一个 504，让人以为后端挂了。
  location /api/ {
    # 文档导入走这里。后端允许单文件 100MB、批量请求 2048MB（application.yml 的
    # MAX_FILE_SIZE / MAX_REQUEST_SIZE），nginx 默认只放 1MB——不显式放开的话，
    # 上传在网关层就被 413 掉，后端其实什么都还没收到。这里对齐批量请求的上限。
    client_max_body_size 2048m;
    proxy_pass http://backend:8080;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Trace-Id $http_x_trace_id;
    proxy_connect_timeout 10s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
  }
}
