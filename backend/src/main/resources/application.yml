server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    max-swallow-size: 100MB
spring:
  application:
    name: llmkb-backend
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:knowledge}
    password: ${DB_PASSWORD:knowledge123}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 10000
      validation-timeout: 3000
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 3s
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:100MB}
      # 批量接入一次提交多个文件：请求体上限必须大于「文件数 × 单文件上限」，
      # 否则多文件的批次会在网关层就被拒掉，而每个文件本身并未超限。
      max-request-size: ${MAX_REQUEST_SIZE:2048MB}
mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
knowledge:
  ai-service-base-url: ${AI_SERVICE_BASE_URL:http://127.0.0.1:12000}
  # 摄入原件保存目录，供资料与摄入页面预览源文件
  source-storage-dir: ${SOURCE_STORAGE_DIR:data/source-files}
  # 批量接入：一次提交多个文件后台解析，并发度与上限按机器与 AI 服务承载调整
  batch:
    concurrency: ${KNOWLEDGE_BATCH_CONCURRENCY:3}
    queue-capacity: ${KNOWLEDGE_BATCH_QUEUE_CAPACITY:200}
    max-files: ${KNOWLEDGE_BATCH_MAX_FILES:50}
    max-file-mb: ${KNOWLEDGE_BATCH_MAX_FILE_MB:20}
    # 内存里保留的批次明细数：已结束的批次按时间淘汰，运行中的批次永不淘汰
    max-tracked: ${KNOWLEDGE_BATCH_MAX_TRACKED:200}
  ai-connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:10000}
  ai-read-timeout-ms: ${AI_READ_TIMEOUT_MS:180000}
  startup-fail-fast: ${STARTUP_FAIL_FAST:false}
  # 数据源连接器统一跳过 SSL 证书校验：内网 Jira/Confluence 多为自签名证书或 IP 直连，
  # 打开后不必逐个配置 insecureSsl；只影响连接器出向请求。
  connector-trust-all-ssl: ${KNOWLEDGE_CONNECTOR_TRUST_ALL_SSL:false}
  ops-rbac-enabled: ${OPS_RBAC_ENABLED:false}
  ops-viewer-token: ${OPS_VIEWER_TOKEN:}
  ops-operator-token: ${OPS_OPERATOR_TOKEN:}
  ops-admin-token: ${OPS_ADMIN_TOKEN:}
  acl:
    identity-db-enabled: ${KNOWLEDGE_ACL_IDENTITY_DB_ENABLED:true}
    trusted-header-enabled: ${KNOWLEDGE_ACL_TRUSTED_HEADER_ENABLED:false}
  # 控制台登录认证：关闭后 API 恢复为全开放（仅供脚本/迁移期使用）
  auth:
    enabled: ${AUTH_ENABLED:true}
    allow-anonymous: ${AUTH_ALLOW_ANONYMOUS:false}
    session-hours: ${AUTH_SESSION_HOURS:12}
    bootstrap-admin-username: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:admin}
    # 留空则首次启动时随机生成并打印在启动日志中
    bootstrap-admin-password: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:}
  # 对外接口服务：RESTful / MCP Server / SSE 三通道共用一个 API Key 与一套审计
  external:
    enabled: ${EXTERNAL_API_ENABLED:true}
    mcp-enabled: ${EXTERNAL_MCP_ENABLED:true}
    sse-enabled: ${EXTERNAL_SSE_ENABLED:true}
    sse-heartbeat-seconds: ${EXTERNAL_SSE_HEARTBEAT_SECONDS:15}
    sse-max-minutes: ${EXTERNAL_SSE_MAX_MINUTES:30}
    answer-chunk-chars: ${EXTERNAL_ANSWER_CHUNK_CHARS:40}
    answer-chunk-delay-millis: ${EXTERNAL_ANSWER_CHUNK_DELAY_MILLIS:40}
    default-rate-limit-per-minute: ${EXTERNAL_DEFAULT_RATE_LIMIT:60}
    # 允许嵌入聊天组件的站点来源，逗号分隔；为空表示不校验来源（仅建议内网使用）
    allowed-origins: ${EXTERNAL_ALLOWED_ORIGINS:}
    # 嵌入组件访问令牌有效期（小时）与签名密钥；密钥为空时启动时自动生成
    embed-token-hours: ${EXTERNAL_EMBED_TOKEN_HOURS:12}
    # 调用方指定有效期时的上限（小时，0 表示不限制）；是否允许签发长期有效令牌
    embed-token-max-hours: ${EXTERNAL_EMBED_TOKEN_MAX_HOURS:8760}
    embed-token-permanent: ${EXTERNAL_EMBED_TOKEN_PERMANENT:true}
    embed-token-secret: ${EXTERNAL_EMBED_TOKEN_SECRET:}
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.jh.knowledgeos: ${APP_LOG_LEVEL:INFO}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

indexing:
  outbox:
    enabled: ${INDEX_OUTBOX_ENABLED:true}
    poll-interval-ms: ${INDEX_OUTBOX_POLL_INTERVAL_MS:1000}
    batch-size: ${INDEX_OUTBOX_BATCH_SIZE:20}
    max-attempts: ${INDEX_OUTBOX_MAX_ATTEMPTS:8}
    retry-base-seconds: ${INDEX_OUTBOX_RETRY_BASE_SECONDS:2}
    lock-timeout-seconds: ${INDEX_OUTBOX_LOCK_TIMEOUT_SECONDS:300}
    archive:
      enabled: ${INDEX_OUTBOX_ARCHIVE_ENABLED:true}
      retention-days: ${INDEX_OUTBOX_RETENTION_DAYS:14}
      batch-size: ${INDEX_OUTBOX_ARCHIVE_BATCH_SIZE:500}
      interval-ms: ${INDEX_OUTBOX_ARCHIVE_INTERVAL_MS:3600000}
