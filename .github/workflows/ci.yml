name: CI
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '8', cache: maven }
      - name: Unit test and package backend
        working-directory: backend
        run: mvn -B test package
      - name: MySQL/Flyway integration test
        working-directory: backend
        run: mvn -B -Pintegration-test verify
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r ai-service/requirements.txt
      - name: Smoke tests
        run: ./scripts/check-v11.sh
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install and build
        working-directory: frontend
        run: npm install && npm run build
  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config --quiet

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, ai-service, frontend, compose-validate]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Elasticsearch host
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Boot full stack
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: Wait until ready
        run: ./scripts/wait-ready.sh
      - name: Black-box E2E
        env:
          E2E_REQUIRE_EXTERNAL_RETRIEVAL: "true"
        run: python scripts/e2e-test.py
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Shutdown
        if: always()
        run: docker compose down -v
