services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
    - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ELASTICSEARCH_INITIAL_ADMIN_PASSWORD: ${ELASTICSEARCH_INITIAL_ADMIN_PASSWORD}
      ELASTICSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
  milvus:
    image: milvusdb/milvus:v3.0.1
    command:
    - milvus
    - run
    - standalone
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
    - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 10s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
    - neo4j_data:/data
  ai-service:
    # 与 release compose 同名同 tag：本地构建出来的镜像可以直接被安装包复用、导出，
    # 不必再 docker tag 一次。
    image: ${IMAGE_PREFIX:-knowledge-os}/ai-service:${VERSION:-1.1.0}
    build:
      context: ../ai-service
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      KNOWLEDGE_DATA_DIR: /app/data
      NEO4J_URI: bolt://neo4j:7687
      ELASTICSEARCH_URL: https://elasticsearch:9200
      MILVUS_URL: http://milvus:19530
    volumes:
    - ai_data:/app/data
    # 出厂默认（检索策略等）在镜像的 /app/config 里，首次启动由服务自己播种到 data 卷。
    # 卷一旦创建就不会被新镜像覆盖，所以改默认配置靠的是播种逻辑，不是重新打镜像。
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:12000/health', timeout=3).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
    - elasticsearch
    - milvus
    - neo4j
  backend:
    image: ${IMAGE_PREFIX:-knowledge-os}/backend:${VERSION:-1.1.0}
    # 上下文必须是仓库根：后端镜像要带上 contracts/（判定规则真源，见 IntranetAddressRules）
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DB_URL: jdbc:mysql://mysql:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:12000
      STARTUP_FAIL_FAST: 'true'
      INDEX_OUTBOX_ENABLED: 'false'
      # 默认配置的外置目录（场景模板、衍生规则）。改完文件重启即生效，不必重打镜像。
      KNOWLEDGE_CONFIG_DIR: /app/config
      # 演示数据：auto=业务表为空时灌入镜像内置快照；false=保持空系统。
      # 连接变量供恢复脚本写 MySQL / ES / Milvus / Neo4j，缺省会退回 http + 空账号而静默失败。
      DEMO_SEED: ${DEMO_SEED:-auto}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-knowledge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-knowledge123}
      MYSQL_DB: ${MYSQL_DATABASE:-knowledge_os}
      ES_URL: ${ELASTICSEARCH_URL:-http://elasticsearch:9200}
      ES_USER: ${ELASTICSEARCH_USERNAME:-elastic}
      ES_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      MILVUS_URL: ${MILVUS_URL:-http://milvus:19530}
      NEO4J_URL: ${NEO4J_HTTP_URL:-http://neo4j:7474}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-}
    volumes:
    - backend_config:/app/config
    depends_on:
      mysql:
        condition: service_started
      redis:
        condition: service_started
      # 等 AI 服务真正能响应再启动后端：启动即校验配置，早于它就绪会 fail-fast 退出。
      ai-service:
        condition: service_healthy
  index-worker:
    image: ${IMAGE_PREFIX:-knowledge-os}/backend:${VERSION:-1.1.0}
    # 上下文必须是仓库根：后端镜像要带上 contracts/（判定规则真源，见 IntranetAddressRules）
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DB_URL: jdbc:mysql://mysql:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:12000
      STARTUP_FAIL_FAST: 'true'
      INDEX_OUTBOX_ENABLED: 'true'
      INDEX_OUTBOX_ARCHIVE_ENABLED: 'true'
      SERVER_PORT: '8081'
      # 与 backend 同一镜像：只跑索引任务，不参与演示数据恢复。
      DEMO_SEED: 'false'
      KNOWLEDGE_CONFIG_DIR: /app/config
    volumes:
    # 只读：与 backend 共用同一份配置，播种和写入由 backend 负责。
    # 卷仍为空时读不到外部文件，回退到 jar 里的那份，不影响启动。
    - backend_config:/app/config:ro
    depends_on:
    - mysql
    - redis
    - ai-service
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
    - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus_data:/prometheus
    depends_on:
    - backend
    - index-worker
  frontend:
    image: ${IMAGE_PREFIX:-knowledge-os}/frontend:${VERSION:-1.1.0}
    build: ../frontend
    restart: unless-stopped
    ports:
    - ${PUBLIC_HTTP_PORT:-8088}:80
    depends_on:
    - backend
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls
      http://0.0.0.0:2379 --data-dir /etcd
    volumes:
    - milvus_etcd:/etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 10s
      timeout: 5s
      retries: 20
  milvus-minio:
    # docker hub 的 minio/minio 仓库已下线，改用官方维护的 quay 源；
    # 该镜像只认 MINIO_ROOT_USER/ROOT_PASSWORD，旧的 ACCESS_KEY/SECRET_KEY 会被忽略并导致启动失败。
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes:
    - milvus_minio:/minio_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  # 后端默认配置（场景模板、衍生规则）。放在卷里是为了能直接改，改完重启生效。
  backend_config: {}
  mysql_data: {}
  redis_data: {}
  elasticsearch_data: {}
  milvus_data: {}
  neo4j_data: {}
  ai_data: {}
  prometheus_data: {}
  milvus_etcd: {}
  milvus_minio: {}
