services:
  mysql:
    image: mysql:8.0.36
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
    - mysql_data:/var/lib/mysql
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
    - redis-server
    - --appendonly
    - 'yes'
    volumes:
    - redis_data:/data
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    restart: unless-stopped
    environment:
      discovery.type: single-node
      ELASTICSEARCH_INITIAL_ADMIN_PASSWORD: ${ELASTICSEARCH_INITIAL_ADMIN_PASSWORD}
      ELASTICSEARCH_JAVA_OPTS: -Xms2g -Xmx2g
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
  milvus:
    image: milvusdb/milvus:v3.0.1
    command:
    - milvus
    - run
    - standalone
    restart: unless-stopped
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    volumes:
    - milvus_data:/var/lib/milvus
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 10s
      timeout: 5s
      retries: 30
  neo4j:
    image: neo4j:5.26
    restart: unless-stopped
    env_file: ../.env.production
    volumes:
    - neo4j_data:/data
  ai-service:
    build:
      context: ../ai-service
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      KNOWLEDGE_DATA_DIR: /app/data
      NEO4J_URI: bolt://neo4j:7687
      ELASTICSEARCH_URL: https://elasticsearch:9200
      MILVUS_URL: http://milvus:19530
    volumes:
    - ai_data:/app/data
    depends_on:
    - elasticsearch
    - milvus
    - neo4j
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DB_URL: jdbc:mysql://mysql:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:12000
      STARTUP_FAIL_FAST: 'true'
      INDEX_OUTBOX_ENABLED: 'false'
    depends_on:
    - mysql
    - redis
    - ai-service
  index-worker:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env.production
    environment:
      DB_URL: jdbc:mysql://mysql:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:12000
      STARTUP_FAIL_FAST: 'true'
      INDEX_OUTBOX_ENABLED: 'true'
      INDEX_OUTBOX_ARCHIVE_ENABLED: 'true'
      SERVER_PORT: '8081'
    depends_on:
    - mysql
    - redis
    - ai-service
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    volumes:
    - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    - prometheus_data:/prometheus
    depends_on:
    - backend
    - index-worker
  frontend:
    build: ../frontend
    restart: unless-stopped
    ports:
    - ${PUBLIC_HTTP_PORT:-8088}:80
    depends_on:
    - backend
  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls
      http://0.0.0.0:2379 --data-dir /etcd
    volumes:
    - milvus_etcd:/etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 10s
      timeout: 5s
      retries: 20
  milvus-minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes:
    - milvus_minio:/minio_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql_data: {}
  redis_data: {}
  elasticsearch_data: {}
  milvus_data: {}
  neo4j_data: {}
  ai_data: {}
  prometheus_data: {}
  milvus_etcd: {}
  milvus_minio: {}
