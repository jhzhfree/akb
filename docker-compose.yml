services:
  mysql:
    image: mysql:8.0.36
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-knowledge_os}
      MYSQL_USER: ${MYSQL_USER:-knowledge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-knowledge123}
    ports:
    - 3306:3306
    volumes:
    - mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent
      interval: 10s
      timeout: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    ports:
    - 6379:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 10s
      timeout: 3s
      retries: 10
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      ELASTICSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
    - 9200:9200
    - 9600:9600
    volumes:
    - elasticsearch_data:/usr/share/elasticsearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
      - CMD-SHELL
      - curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null
      interval: 10s
      timeout: 5s
      retries: 30
  milvus:
    image: milvusdb/milvus:v3.0.1
    command:
    - milvus
    - run
    - standalone
    ports:
    - 19530:19530
    - 9091:9091
    volumes:
    - milvus_data:/var/lib/milvus
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9091/healthz
      interval: 10s
      timeout: 5s
      retries: 30
    container_name: milvus-standalone
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-knowledge123}
    ports:
    - 7474:7474
    - 7687:7687
    volumes:
    - neo4j_data:/data
    healthcheck:
      test:
      - CMD-SHELL
      - cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-knowledge123} 'RETURN 1' >/dev/null
        2>&1 || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
  ai-service:
    image: knowledge-os/ai-service:${VERSION:-1.1.0}
    build:
      context: ./ai-service
      args:
        INSTALL_ML: ${INSTALL_ML:-false}
    env_file:
    - .env
    environment:
      KNOWLEDGE_DATA_DIR: /app/data
      NEO4J_URI: bolt://neo4j:7687
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MILVUS_URL: http://milvus:19530
    ports:
    - 12000:12000
    volumes:
    - ai_data:/app/data
    depends_on:
      neo4j:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
    extra_hosts:
    - host.docker.internal:host-gateway
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:12000/health',
        timeout=2)
      interval: 10s
      timeout: 4s
      retries: 15
  backend:
    image: knowledge-os/backend:${VERSION:-1.1.0}
    build: ./backend
    env_file:
    - .env
    environment:
      DB_URL: jdbc:mysql://mysql:3306/knowledge_os?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_HOST: redis
      AI_SERVICE_BASE_URL: http://ai-service:12000
    ports:
    - 8080:8080
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - curl
      - -fsS
      - http://127.0.0.1:8080/actuator/health
      interval: 10s
      timeout: 4s
      retries: 20
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    volumes:
    - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
    - 9090:9090
    depends_on:
      backend:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin123}
    ports:
    - 3000:3000
    volumes:
    - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
    - prometheus
  frontend:
    image: knowledge-os/frontend:${VERSION:-1.1.0}
    build: ./frontend
    ports:
    - 8088:80
    depends_on:
      backend:
        condition: service_healthy
  milvus-etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: '1000'
      ETCD_QUOTA_BACKEND_BYTES: '4294967296'
      ETCD_SNAPSHOT_COUNT: '50000'
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls
      http://0.0.0.0:2379 --data-dir /etcd
    volumes:
    - milvus_etcd:/etcd
    healthcheck:
      test:
      - CMD
      - etcdctl
      - endpoint
      - health
      interval: 10s
      timeout: 5s
      retries: 20
  milvus-minio:
    container_name: milvus-minio
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address :9001
    volumes:
    - milvus_minio:/minio_data
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 20
volumes:
  mysql_data: null
  elasticsearch_data: null
  milvus_data: null
  neo4j_data: null
  ai_data: null
  milvus_etcd: {}
  milvus_minio: {}
