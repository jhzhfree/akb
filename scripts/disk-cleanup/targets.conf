# C 盘用户目录清理目标清单
# 由 scripts/disk-cleanup/cleanup-user.sh 以 source 方式加载
#
# 格式（竖线分隔，行首 # 为注释）：
#   <Windows 路径>|<类别>|<默认启用 1/0>|<说明>
#
# 说明：
#   - <Windows 路径> 必须是 C:\ 开头，脚本会自动转换为 /mnt/c/...
#   - <类别> 用于 --only <类别> 过滤，例如 --only temp
#   - <默认启用> 为 0 的条目需要显式 --enable-all 才会纳入
#   - 严禁把 AppData\Local\Packages 加入清单（内含 WSL 发行版 ext4.vhdx）

