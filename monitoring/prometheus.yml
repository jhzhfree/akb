global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: llmkb-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
  - job_name: llmkb-index-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["index-worker:8081"]
